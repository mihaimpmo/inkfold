<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Inkfold — design anything</title>
<meta name="description" content="Inkfold is a free, open-source design editor that runs entirely in your browser.">
<meta name="theme-color" content="#5b3df5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b3df5'/%3E%3Crect x='13' y='8' width='6' height='16' rx='1' fill='%23fff'/%3E%3Ccircle cx='23' cy='23' r='3' fill='%23ffcf3f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Poppins:wght@400;700;900&family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,800;1,400&family=Bebas+Neue&family=Lobster&family=Pacifico&family=Oswald:wght@400;700&family=Roboto+Slab:wght@400;800&family=Raleway:wght@400;800&family=Anton&family=Dancing+Script:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@400;700&family=Archivo+Black&family=Caveat:wght@400;700&family=DM+Serif+Display&family=Abril+Fatface&family=Permanent+Marker&family=Righteous&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">I</span><span class="brand-name">Inkfold</span></div>
  <button class="tbtn" id="btnNew" title="New design">New</button>
  <button class="tbtn" id="btnDesigns" title="My designs">Designs</button>
  <button class="tbtn icon" id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
  <button class="tbtn icon" id="btnRedo" title="Redo (Ctrl+Y)">↷</button>
  <input id="title" class="title" value="Untitled design" aria-label="Design title">
  <span id="saveState" class="save-state">Saved</span>
  <div class="spacer"></div>
  <button class="tbtn" id="btnHistory" title="Version history">History</button>
  <button class="tbtn pro" id="btnResize" title="Magic Resize">Resize</button>
  <button class="tbtn primary" id="btnExport">Download</button>
</header>

<div class="main">
  <nav class="rail" id="rail">
    <button data-tab="templates" class="on"><i>▦</i><span>Templates</span></button>
    <button data-tab="elements"><i>◆</i><span>Elements</span></button>
    <button data-tab="text"><i>T</i><span>Text</span></button>
    <button data-tab="uploads"><i>⇪</i><span>Uploads</span></button>
    <button data-tab="photos"><i>▣</i><span>Photos</span></button>
    <button data-tab="draw"><i>✎</i><span>Draw</span></button>
    <button data-tab="brand"><i>★</i><span>Brand</span></button>
    <button data-tab="layers"><i>☰</i><span>Layers</span></button>
  </nav>

  <aside class="panel" id="panel">
    <section data-pane="templates" class="on">
      <h3>Templates</h3>
      <div class="grid2" id="tplGrid"></div>
    </section>

    <section data-pane="elements">
      <h3>Shapes</h3>
      <div class="grid4" id="shapeGrid"></div>
      <h3>Icons</h3>
      <div class="grid4" id="iconGrid"></div>
      <h3>QR code</h3>
      <div class="row"><input id="qrText" placeholder="https://..." class="inp"><button class="btn" id="qrAdd">Add</button></div>
    </section>

    <section data-pane="text">
      <h3>Text</h3>
      <button class="txt-add h" data-text="heading">Add a heading</button>
      <button class="txt-add s" data-text="sub">Add a subheading</button>
      <button class="txt-add b" data-text="body">Add a little bit of body text</button>
      <h3>Font combinations</h3>
      <div class="grid2" id="comboGrid"></div>
    </section>

    <section data-pane="uploads">
      <h3>Uploads</h3>
      <label class="drop" id="drop">
        <input type="file" id="fileIn" accept="image/*,.svg" multiple hidden>
        <b>Upload images</b><span>or drop / paste them here</span>
      </label>
      <div class="grid2" id="uploadGrid"></div>
    </section>

    <section data-pane="photos">
      <h3>Free photos</h3>
      <div class="row"><input id="photoQ" class="inp" placeholder="Search Openverse" value="nature"><button class="btn" id="photoGo">Search</button></div>
      <div class="grid2" id="photoGrid"></div>
      <p class="hint">Openly licensed photos from Openverse. Credit is in each tooltip.</p>
    </section>

    <section data-pane="draw">
      <h3>Draw</h3>
      <button class="btn wide" id="drawToggle">Start drawing</button>
      <label class="lbl">Brush colour <input type="color" id="brushColor" value="#5b3df5"></label>
      <label class="lbl">Brush size <input type="range" id="brushSize" min="1" max="80" value="8"></label>
      <div class="row">
        <button class="chip on" data-brush="Pencil">Pen</button>
        <button class="chip" data-brush="Circle">Marker</button>
        <button class="chip" data-brush="Spray">Spray</button>
      </div>
    </section>

    <section data-pane="brand">
      <h3>Brand kit <span class="badge">PRO</span></h3>
      <label class="lbl">Brand colours</label>
      <div class="swatches" id="brandColors"></div>
      <div class="row"><input type="color" id="brandColorIn" value="#5b3df5"><button class="btn" id="brandColorAdd">Add colour</button></div>
      <label class="lbl">Heading font <select id="brandHead" class="inp"></select></label>
      <label class="lbl">Body font <select id="brandBody" class="inp"></select></label>
      <button class="btn wide" id="brandApply">Apply brand fonts to this page</button>
      <label class="lbl">Logos</label>
      <div class="grid2" id="brandLogos"></div>
      <label class="btn wide"><input type="file" id="logoIn" accept="image/*,.svg" hidden>Upload logo</label>
    </section>

    <section data-pane="layers">
      <h3>Layers</h3>
      <ul class="layers" id="layerList"></ul>
    </section>
  </aside>

  <div class="stage-wrap">
    <div class="ctx" id="ctx"></div>
    <div class="stage" id="stage">
      <div class="page-shadow" id="pageShadow"><canvas id="c"></canvas></div>
    </div>
    <footer class="foot">
      <div class="pages" id="pages"></div>
      <div class="zoom">
        <button class="tbtn icon" id="zoomOut">−</button>
        <button class="tbtn" id="zoomFit" title="Fit">Fit</button>
        <span id="zoomVal">100%</span>
        <button class="tbtn icon" id="zoomIn">+</button>
      </div>
    </footer>
  </div>

  <aside class="props" id="props"></aside>
</div>

<div class="modal" id="modal" hidden>
  <div class="dialog">
    <button class="x" id="modalX" aria-label="Close">×</button>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
